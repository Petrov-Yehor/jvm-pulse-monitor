<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>J-Pulse</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
    <h1>J-Pulse</h1>
    <span id="status" class="status">connecting...</span>
</header>

<main>
    <div class="cards">
        <div class="card">
            <div class="label">Heap</div>
            <div class="value" id="heap">–</div>
        </div>
        <div class="card">
            <div class="label">CPU</div>
            <div class="value" id="cpu">–</div>
        </div>
        <div class="card">
            <div class="label">Threads</div>
            <div class="value" id="threads">–</div>
        </div>
        <div class="card">
            <div class="label">GC runs</div>
            <div class="value" id="gc">–</div>
        </div>
    </div>
    <div class="chaos">
        <div class="label">Chaos</div>
        <div class="chaos-buttons">
            <button id="leakStart">Start memory leak</button>
            <button id="leakStop">Stop leak</button>
            <button id="gcButton">Force GC</button>
            <span id="chaosState" class="chaos-state">leak: off</span>
        </div>
    </div>
    <div class="charts">
        <div class="chart-card">
            <div class="label">Heap used (MB)</div>
            <div class="chart-box"><canvas id="heapChart"></canvas></div>
        </div>
        <div class="chart-card">
            <div class="label">CPU (%)</div>
            <div class="chart-box"><canvas id="cpuChart"></canvas></div>
        </div>
        <div class="chart-card">
            <div class="label">Threads</div>
            <div class="chart-box"><canvas id="threadsChart"></canvas></div>
        </div>
        <div class="chart-card">
            <div class="label">GC runs per second</div>
            <div class="chart-box"><canvas id="gcChart"></canvas></div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
